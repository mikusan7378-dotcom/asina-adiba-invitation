<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asina va Adiba — Taklifnoma</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fdf6f8;
  font-family: Georgia, serif;
}

/* Блокируем прокрутку, пока конверт закрыт */
body.locked {
  overflow: hidden;
  height: 100vh;
}

/* --- ОТКРЫВАШКА (КОНВЕРТ) --- */
.envelope-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: opacity 0.9s ease, visibility 0.9s ease;
}

.envelope-overlay.opened {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Левая и правая створки */
.flap {
  position: absolute;
  top: 0;
  width: 50.5%;
  height: 100%;
  background: linear-gradient(135deg, #fbe8ef 0%, #f3d5e1 50%, #e9bfd0 100%);
  box-shadow: 0 0 30px rgba(139, 83, 104, 0.25);
  transition: transform 1.1s cubic-bezier(0.77, 0, 0.175, 1);
}

.flap-left {
  left: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.7);
}

.flap-right {
  right: 0;
  border-left: 1px solid rgba(255, 255, 255, 0.7);
}

.envelope-overlay.opened .flap-left {
  transform: translateX(-102%);
}

.envelope-overlay.opened .flap-right {
  transform: translateX(102%);
}

/* Центральная карточка с печатью */
.seal-box {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 28px 24px;
  max-width: 320px;
  width: 85%;
  background: rgba(255, 253, 251, 0.92);
  border: 1.5px solid #e5b8c9;
  border-radius: 22px;
  box-shadow: 0 12px 35px rgba(139, 83, 104, 0.22);
  transition: transform 0.6s ease, opacity 0.5s ease;
}

.envelope-overlay.opened .seal-box {
  transform: scale(0.85);
  opacity: 0;
}

.seal-subtitle {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #9e5874;
  margin-bottom: 8px;
}

.seal-names {
  font-size: 26px;
  font-weight: bold;
  color: #5c2d40;
  margin-bottom: 6px;
}

.seal-date {
  font-size: 13px;
  color: #8b5368;
  margin-bottom: 22px;
}

.open-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  border: 3px solid #fff5f8;
  background: radial-gradient(circle at 30% 30%, #d48ba7, #9c4a6b);
  color: #fff;
  font-family: Georgia, serif;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(156, 74, 107, 0.45), inset 0 0 10px rgba(255, 255, 255, 0.35);
  animation: pulseSeal 2s infinite;
}

@keyframes pulseSeal {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

/* --- ОСНОВНОЕ ПРИГЛАШЕНИЕ --- */
.invitation {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  overflow: hidden;
  background: #fdf6f8;
}

.invitation img {
  display: block;
  width: 255%;
  margin-left: -77.5%;
  height: auto;
}

/* Кликабельные зоны поверх кнопок на картинке */
.map-btn {
  position: absolute;
  left: 28%;
  width: 50%;
  height: 1.9%;
  z-index: 10;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

.map-btn:active {
  transform: scale(0.98);
  background: rgba(255, 255, 255, 0.25);
}

.yandex-btn {
  bottom: 8.65%;
}

.google-btn {
  bottom: 5.95%;
}

/* Живой таймер ровно вместо старого */
.overlay-timer {
  position: absolute;
  bottom: 1.55%;
  left: 22%;
  width: 63%;
  height: 3.9%;
  background: #f7efe8;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 15;
  padding: 2px 4px;
}

.overlay-title {
  font-size: clamp(9px, 2.7vw, 13px);
  color: #7d495b;
  margin-bottom: 2px;
  letter-spacing: 0.3px;
}

.overlay-values {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(4px, 1.5vw, 8px);
  font-size: clamp(16px, 5vw, 24px);
  font-weight: bold;
  color: #2b2124;
  line-height: 1;
}

.overlay-values .sec {
  color: #c82333;
}

.overlay-labels {
  display: flex;
  justify-content: space-between;
  width: 84%;
  margin-top: 3px;
  font-size: clamp(6px, 1.8vw, 8px);
  color: #6b535b;
  letter-spacing: 0.5px;
}

/* Кнопка музыки в правом нижнем углу */
.music {
  position: fixed;
  right: 14px;
  bottom: 18px;
  width: 52px;
  height: 52px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #a85c7d;
  color: white;
  font-size: 22px;
  box-shadow: 0 3px 15px rgba(139, 83, 104, 0.35);
  cursor: pointer;
  z-index: 100;
}
</style>
</head>

<body class="locked">

<!-- ЭКРАН-ОТКРЫВАШКА -->
<div class="envelope-overlay" id="envelope">
  <div class="flap flap-left"></div>
  <div class="flap flap-right"></div>

  <div class="seal-box">
    <div class="seal-subtitle">Beshik to'yiga taklifnoma</div>
    <div class="seal-names">Asina va Adiba</div>
    <div class="seal-date">21-Noyabr, 2026 • 11:00</div>
    <button class="open-btn" onclick="openInvitation()">Ochish</button>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИГЛАШЕНИЕ -->
<main class="invitation">
  <img src="YANDEX%20XARITASI.png" alt="Asina va Adiba">

  <a class="map-btn yandex-btn"
     href="https://yandex.uz/maps/21606/jizzakh/?ll=67.844168%2C40.173988&mode=whatshere&whatshere%5Bpoint%5D=67.844168%2C40.173988&whatshere%5Bzoom%5D=17.77344&z=17"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Yandex Xaritasi"></a>

  <a class="map-btn google-btn"
     href="https://www.google.com/maps/place/40%C2%B010'26.5%22N+67%C2%B050'39.2%22E/@40.1740008,67.8433181,398m/data=!3m1!1e3!4m4!3m3!8m2!3d40.174039!4d67.844209?entry=ttu&g_ep=EgoyMDI2MTExNy4wIKXMDSoASAFQAw%3D%3D"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Google Maps"></a>

  <!-- Живой таймер поверх старого -->
  <div class="overlay-timer" aria-label="Tadbirgacha qolgan vaqt">
    <div class="overlay-title" id="timerTitle">Baxtli diydor onlari yaqin</div>
    <div class="overlay-values">
      <span id="days">01</span>
      <span>:</span>
      <span id="hours">07</span>
      <span>:</span>
      <span id="minutes">45</span>
      <span>:</span>
      <span class="sec" id="seconds">00</span>
    </div>
    <div class="overlay-labels">
      <span>KUN</span>
      <span>SOAT</span>
      <span>DAQIQA</span>
      <span>SONIYA</span>
    </div>
  </div>
</main>

<audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()" id="musicButton" aria-label="Музыка">
  ♫
</button>

<script>
const music = document.getElementById("music");
const button = document.getElementById("musicButton");
const envelope = document.getElementById("envelope");

// Открытие конверта + мгновенный старт музыки
function openInvitation() {
  envelope.classList.add("opened");
  document.body.classList.remove("locked");

  music.play().then(() => {
    button.textContent = "Ⅱ";
  }).catch(() => {
    button.textContent = "♫";
  });
}

// Попытка фонового автозапуска при загрузке (на случай если браузер разрешает)
window.addEventListener("load", () => {
  music.play().then(() => {
    button.textContent = "Ⅱ";
  }).catch(() => {});
});

function toggleMusic() {
  if (music.paused) {
    music.play().then(() => {
      button.textContent = "Ⅱ";
    }).catch(() => {
      button.textContent = "♫";
    });
  } else {
    music.pause();
    button.textContent = "♫";
  }
}

// Целевая дата: 21 ноября 2026, 11:00 (Узбекистан, UTC+5)
const eventDate = new Date("2026-11-21T11:00:00+05:00").getTime();

function updateTimer() {
  const now = Date.now();
  const diff = eventDate - now;
  const titleEl = document.getElementById("timerTitle");

  if (diff <= 0) {
    titleEl.textContent = "Baxtli on boshlandi!";
    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("days").textContent = String(days).padStart(2, "0");
  document.getElementById("hours").textContent = String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
