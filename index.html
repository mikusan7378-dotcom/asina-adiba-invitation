<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;

  min-height: 100%;
  background: #fdf6f8;
  font-family: Georgia, serif;
}

.invitation {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  overflow: hidden;
  background: #fdf6f8;
}

.invitation img {
  display: block;

}

/* Кликабельные зоны поверх кнопок на картинке */
.map-btn {
  position: absolute;
  left: 28%;
  width: 50%;
  height: 1.9%;
  z-index: 10;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

.map-btn:active {
  transform: scale(0.98);
  background: rgba(255, 255, 255, 0.25);
}

.yandex-btn {
  bottom: 8.65%;
}

.google-btn {
  bottom: 5.95%;
}

/* Живой таймер ровно вместо старого, верхний край увеличен до 3.9% */
.overlay-timer {
  position: absolute;
  bottom: 1.55%;
  left: 22%;
  width: 63%;
  height: 3.9%;
  background: #f7efe8;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 15;
  padding: 2px 4px;
}

.overlay-title {
  font-size: clamp(9px, 2.7vw, 13px);
  color: #7d495b;
  margin-bottom: 2px;
  letter-spacing: 0.3px;
}

.overlay-values {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(4px, 1.5vw, 8px);
  font-size: clamp(16px, 5vw, 24px);
  font-weight: bold;
  color: #2b2124;
  line-height: 1;
}

.overlay-values .sec {
  color: #c82333;
}

.overlay-labels {
  display: flex;
  justify-content: space-between;
  width: 84%;
  margin-top: 3px;
  font-size: clamp(6px, 1.8vw, 8px);
  color: #6b535b;
  letter-spacing: 0.5px;
}

/* Кнопка музыки в правом нижнем углу */
.music {
  position: fixed;
  right: 14px;
  bottom: 18px;
  width: 52px;
  height: 52px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #a85c7d;
  color: white;
  font-size: 22px;
  box-shadow: 0 3px 15px rgba(139, 83, 104, 0.35);
  cursor: pointer;
  z-index: 100;
}
</style>
</head>
