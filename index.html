<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asina va Adiba</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fdf6f8;
  font-family: Georgia, serif;
}

.invitation {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  overflow: hidden;
  background: #fdf6f8;
  padding-bottom: 28px;
}

.invitation img {
  display: block;
  width: 255%;
  margin-left: -77.5%;
  height: auto;
}

/* Кликабельные зоны поверх кнопок на макете */
.map-btn {
  position: absolute;
  left: 14%;
  width: 72%;
  height: 2.3%;
  z-index: 10;
  border-radius: 20px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

.map-btn:active {
  transform: scale(0.98);
  background: rgba(255, 255, 255, 0.22);
}

.yandex-btn {
  bottom: 10.6%;
}

.google-btn {
  bottom: 7.8%;
}

/* Отдельный живой таймер под картинкой */
.timer-box {
  margin: 14px auto 0;
  width: calc(100% - 24px);
  max-width: 440px;
  padding: 14px 12px;
  background: #fffdfb;
  border: 1px solid #edd6df;
  border-radius: 18px;
  box-shadow: 0 6px 20px rgba(168, 92, 125, 0.12);
  text-align: center;
}

.timer-title {
  font-size: 13px;
  color: #8b5368;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.timer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.timer-cell {
  background: #fdf3f7;
  border-radius: 12px;
  padding: 8px 4px;
}

.timer-num {
  font-size: 22px;
  font-weight: bold;
  color: #4a353d;
  line-height: 1.1;
}

.timer-num.sec {
  color: #b83b5e;
}

.timer-label {
  margin-top: 3px;
  font-size: 10px;
  color: #7c5c68;
  letter-spacing: 0.5px;
}

.music {
  position: fixed;
  right: 18px;
  bottom: 22px;
  width: 58px;
  height: 58px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #a85c7d;
  color: white;
  font-size: 25px;
  box-shadow: 0 3px 15px rgba(139, 83, 104, 0.35);
  cursor: pointer;
  z-index: 100;
}
</style>
</head>

<body>

<main class="invitation">
  <img src="YANDEX%20XARITASI.png" alt="Asina va Adiba">

  <a class="map-btn yandex-btn"
     href="https://yandex.uz/maps/21606/jizzakh/?ll=67.844168%2C40.173988&mode=whatshere&whatshere%5Bpoint%5D=67.844168%2C40.173988&whatshere%5Bzoom%5D=17.77344&z=17"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Yandex Xaritasi"></a>

  <a class="map-btn google-btn"
     href="https://www.google.com/maps/place/40%C2%B010'26.5%22N+67%C2%B050'39.2%22E/@40.1740008,67.8433181,398m/data=!3m1!1e3!4m4!3m3!8m2!3d40.174039!4d67.844209?entry=ttu&g_ep=EgoyMDI2MTExNy4wIKXMDSoASAFQAw%3D%3D"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Google Maps"></a>

  <section class="timer-box" aria-label="Tadbirgacha qolgan vaqt">
    <div class="timer-title">Baxtli diydor onlari yaqin</div>
    <div class="timer-grid">
      <div class="timer-cell">
        <div class="timer-num" id="days">00</div>
        <div class="timer-label">KUN</div>
      </div>
      <div class="timer-cell">
        <div class="timer-num" id="hours">00</div>
        <div class="timer-label">SOAT</div>
      </div>
      <div class="timer-cell">
        <div class="timer-num" id="minutes">00</div>
        <div class="timer-label">DAQIQA</div>
      </div>
      <div class="timer-cell">
        <div class="timer-num sec" id="seconds">00</div>
        <div class="timer-label">SONIYA</div>
      </div>
    </div>
  </section>
</main>

<audio id="music" loop preload="metadata">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()" id="musicButton" aria-label="Музыка">
  ♫
</button>

<script>
const music = document.getElementById("music");
const button = document.getElementById("musicButton");

function toggleMusic() {
  if (music.paused) {
    music.play().then(() => {
      button.textContent = "Ⅱ";
    }).catch(() => {
      button.textContent = "♫";
    });
  } else {
    music.pause();
    button.textContent = "♫";
  }
}

// Целевая дата: 21 ноября 2026, 11:00 (Узбекистан, UTC+5)
const eventDate = new Date("2026-11-21T11:00:00+05:00").getTime();

function updateTimer() {
  const diff = eventDate - Date.now();
  const titleEl = document.querySelector(".timer-title");

  if (diff <= 0) {
    titleEl.textContent = "Baxtli on boshlandi!";
    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("days").textContent = String(days).padStart(2, "0");
  document.getElementById("hours").textContent = String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
