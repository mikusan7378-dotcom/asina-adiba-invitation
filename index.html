<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asina va Adiba</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fdf6f8;
  font-family: Georgia, serif;
}

.invitation {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  overflow: hidden;
  background: #fdf6f8;
}

.invitation img {
  display: block;
  width: 255%;
  margin-left: -77.5%;
  height: auto;
}

/* Кликабельные зоны поверх кнопок на макете */
.map-btn {
  position: absolute;
  left: 14%;
  width: 72%;
  height: 2.3%;
  z-index: 10;
  border-radius: 20px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

.map-btn:active {
  transform: scale(0.98);
  background: rgba(255, 255, 255, 0.22);
}

.yandex-btn {
  bottom: 8.6%;
}

.google-btn {
  bottom: 5.8%;
}

/* Живой таймер поверх нижнего блока */
.live-timer {
  position: absolute;
  bottom: 1.55%;
  left: 6%;
  width: 88%;
  height: 2.7%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(20px, 6.5vw, 30px);
  font-weight: bold;
  color: #4a353d;
  text-shadow: 0 1px 8px rgba(255, 253, 251, 0.95), 0 0 14px rgba(255, 253, 251, 0.9);
  letter-spacing: 2px;
  z-index: 10;
  pointer-events: none;
}

.music {
  position: fixed;
  right: 18px;
  bottom: 22px;
  width: 58px;
  height: 58px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #a85c7d;
  color: white;
  font-size: 25px;
  box-shadow: 0 3px 15px rgba(139, 83, 104, 0.35);
  cursor: pointer;
  z-index: 100;
}
</style>
</head>

<body>

<main class="invitation">
  <img src="YANDEX%20XARITASI.png" alt="Asina va Adiba">

  <a class="map-btn yandex-btn"
     href="https://yandex.uz/maps/?text=Jizzax%20shahri,%20Zilol%20mahallasi,%20Sug%27diyona%20ko%27chasi"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Yandex Xaritasi"></a>

  <a class="map-btn google-btn"
     href="https://www.google.com/maps/search/?api=1&query=Jizzax+shahri,+Zilol+mahallasi,+Sug%27diyona+ko%27chasi"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Google Maps"></a>

  <div class="live-timer" id="timer">00 : 00 : 00 : 00</div>
</main>

<audio id="music" loop preload="metadata">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()" id="musicButton" aria-label="Музыка">
  ♫
</button>

<script>
const music = document.getElementById("music");
const button = document.getElementById("musicButton");

function toggleMusic() {
  if (music.paused) {
    music.play().then(() => {
      button.textContent = "Ⅱ";
    }).catch(() => {
      button.textContent = "♫";
    });
  } else {
    music.pause();
    button.textContent = "♫";
  }
}

// Целевая дата: 21 ноября 2026, 11:00 (Узбекистан, UTC+5)
const eventDate = new Date("2026-11-21T11:00:00+05:00").getTime();

function updateTimer() {
  const now = Date.now();
  const diff = eventDate - now;
  const timerEl = document.getElementById("timer");

  if (diff <= 0) {
    timerEl.textContent = "TO'Y BOSHLANDI!";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  const d = String(days).padStart(2, "0");
  const h = String(hours).padStart(2, "0");
  const m = String(minutes).padStart(2, "0");
  const s = String(seconds).padStart(2, "0");

  timerEl.textContent = `${d} : ${h} : ${m} : ${s}`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
