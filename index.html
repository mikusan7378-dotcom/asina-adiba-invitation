<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asina va Adiba</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #f8eaf0;
}

body {
  font-family: Georgia, serif;
}

.invitation {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

.invitation img {
  display: block;
  width: 100%;
  height: auto;
}

.music {
  position: fixed;
  right: 18px;
  bottom: 22px;
  width: 58px;
  height: 58px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #a85c7d;
  color: white;
  font-size: 25px;
  box-shadow: 0 3px 15px #8b536855;
  cursor: pointer;
  z-index: 100;
}
</style>
</head>

<body>

<main class="invitation">
  <img src="YANDEX%20XARITASI.png" alt="Asina va Adiba">
</main>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()" id="musicButton">
  ♫
</button>

<script>
const music = document.getElementById("music");
const button = document.getElementById("musicButton");

function toggleMusic() {
  if (music.paused) {
    music.play().then(() => {
      button.textContent = "Ⅱ";
    }).catch(() => {
      button.textContent = "♫";
    });
  } else {
    music.pause();
    button.textContent = "♫";
  }
}
</script>

</body>
</html>
