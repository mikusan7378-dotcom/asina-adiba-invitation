<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asina va Adiba</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fdf6f8;
  font-family: Georgia, serif;
}

.invitation {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  overflow: hidden;
  background: #fdf6f8;
}

.invitation img {
  display: block;
  width: 255%;
  margin-left: -77.5%;
  height: auto;
}

/* Мягкие размытые переходы на стыках между блоками */
.seam-blur {
  position: absolute;
  left: -5%;
  width: 110%;
  height: 3.2%;
  pointer-events: none;
  z-index: 5;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* Шов 1: между замком и фото девочек */
.seam-1 {
  top: 23.8%;
  background: linear-gradient(
    to bottom,
    rgba(246, 234, 240, 0) 0%,
    rgba(246, 234, 240, 0.85) 45%,
    rgba(248, 235, 240, 0.85) 55%,
    rgba(248, 235, 240, 0) 100%
  );
}

/* Шов 2: между фото девочек и блоком TAKLIFNOMA */
.seam-2 {
  top: 49.0%;
  background: linear-gradient(
    to bottom,
    rgba(250, 238, 242, 0) 0%,
    rgba(252, 243, 246, 0.9) 45%,
    rgba(253, 246, 248, 0.9) 55%,
    rgba(253, 246, 248, 0) 100%
  );
}

/* Шов 3: между блоком TAKLIFNOMA и календарём */
.seam-3 {
  top: 74.2%;
  background: linear-gradient(
    to bottom,
    rgba(253, 246, 248, 0) 0%,
    rgba(252, 244, 247, 0.9) 45%,
    rgba(250, 242, 246, 0.9) 55%,
    rgba(250, 242, 246, 0) 100%
  );
}

/* Кликабельные зоны поверх кнопок на макете */
.map-btn {
  position: absolute;
  left: 13%;
  width: 74%;
  height: 2.3%;
  z-index: 10;
  border-radius: 20px;
  cursor: pointer;
}

.yandex-btn {
  bottom: 8.6%;
}

.google-btn {
  bottom: 5.8%;
}

/* Живой таймер обратного отсчёта */
.live-timer {
  position: absolute;
  bottom: 1.55%;
  left: 5%;
  width: 90%;
  height: 2.7%;
  background: #fffdfb;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(20px, 6.5vw, 30px);
  font-weight: bold;
  color: #4a353d;
  letter-spacing: 2px;
  z-index: 10;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
}

.music {
  position: fixed;
  right: 18px;
  bottom: 22px;
  width: 58px;
  height: 58px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #a85c7d;
  color: white;
  font-size: 25px;
  box-shadow: 0 3px 15px rgba(139, 83, 104, 0.35);
  cursor: pointer;
  z-index: 100;
}
</style>
</head>

<body>

<main class="invitation">
  <img src="YANDEX%20XARITASI.png" alt="Asina va Adiba">

  <!-- Размытые переходы на стыках -->
  <div class="seam-blur seam-1"></div>
  <div class="seam-blur seam-2"></div>
  <div class="seam-blur seam-3"></div>

  <a class="map-btn yandex-btn"
     href="https://yandex.uz/maps/?text=Jizzax%20shahri,%20Zilol%20mahallasi,%20Sug%27diyona%20ko%27chasi"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Yandex Xaritasi"></a>

  <a class="map-btn google-btn"
     href="https://www.google.com/maps/search/?api=1&query=Jizzax+shahri,+Zilol+mahallasi,+Sug%27diyona+ko%27chasi"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Google Maps"></a>

  <div class="live-timer" id="timer">00 : 00 : 00 : 00</div>
</main>

<audio id="music" loop preload="metadata">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()" id="musicButton" aria-label="Музыка">
  ♫
</button>

<script>
const music = document.getElementById("music");
const button = document.getElementById("musicButton");

function toggleMusic() {
  if (music.paused) {
    music.play().then(() => {
      button.textContent = "Ⅱ";
    }).catch(() => {
      alert("Проверьте, что файл music.mp3 загружен в корень репозитория GitHub.");
    });
  } else {
    music.pause();
    button.textContent = "♫";
  }
}

// Целевая дата: 21 ноября 2026, 11:00 (Узбекистан, UTC+5)
const eventDate = new Date("2026-11-21T11:00:00+05:00").getTime();

function updateTimer() {
  const now = Date.now();
  const diff = eventDate - now;
  const timerEl = document.getElementById("timer");

  if (diff <= 0) {
    timerEl.textContent = "TO'Y BOSHLANDI!";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  const d = String(days).padStart(2, "0");
  const h = String(hours).padStart(2, "0");
  const m = String(minutes).padStart(2, "0");
  const s = String(seconds).padStart(2, "0");

  timerEl.textContent = `${d} : ${h} : ${m} : ${s}`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
